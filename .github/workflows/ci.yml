name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-llvm-cov

      - name: Run Tests With Coverage
        run: cargo llvm-cov --no-report

      - name: Generate Coverage Summary
        run: |
          cargo llvm-cov report 2>&1 | tee coverage.txt

          {
            awk '
              /^Filename/ { found=1; next }
              /^---/ { next }
              found && NF > 0 {
                file=$1; lines=$8; missed=$9; cover=$10
                if (file == "TOTAL") {
                  total=cover
                  rows[n++] = sprintf("| **%s** | **%s** | **%s** | **%s** |", file, lines, missed, cover)
                } else {
                  rows[n++] = sprintf("| `%s` | %s | %s | %s |", file, lines, missed, cover)
                }
              }
              END {
                print "## Test Coverage"
                print ""
                printf "**Overall line coverage: %s**\n\n", total
                print "| File | Lines | Missed | Coverage |"
                print "|------|------:|-------:|---------:|"
                for (i=0; i<n; i++) print rows[i]
              }
            ' coverage.txt
          } >> "$GITHUB_STEP_SUMMARY"

  platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.os }}

      - name: Test
        run: cargo test

  map-data:
    name: Map Data Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Regenerate vendored map data
        run: cargo xtask gen-map-data

      - name: Check for drift
        run: |
          git diff --exit-code -- src/tui/map/coastline.rs src/tui/map/zone_coords.rs \
            || { echo "::error::Vendored map data is stale. Run 'cargo xtask gen-map-data' and commit the result."; exit 1; }
