name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-llvm-cov

      - name: Run Tests With Coverage
        run: cargo llvm-cov --no-report

      - name: Generate Coverage Summary
        run: |
          cargo llvm-cov report 2>&1 | tee coverage.txt

          {
            awk '
              /^Filename/ { found=1; next }
              /^---/ { next }
              found && NF > 0 {
                file=$1; lines=$8; missed=$9; cover=$10
                if (file == "TOTAL") {
                  total=cover
                  rows[n++] = sprintf("| **%s** | **%s** | **%s** | **%s** |", file, lines, missed, cover)
                } else {
                  rows[n++] = sprintf("| `%s` | %s | %s | %s |", file, lines, missed, cover)
                }
              }
              END {
                print "## Test Coverage"
                print ""
                printf "**Overall line coverage: %s**\n\n", total
                print "| File | Lines | Missed | Coverage |"
                print "|------|------:|-------:|---------:|"
                for (i=0; i<n; i++) print rows[i]
              }
            ' coverage.txt
          } >> "$GITHUB_STEP_SUMMARY"

  platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}

      - name: Test
        run: cargo test

  map-data:
    name: Map Data Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Regenerate vendored map data
        run: cargo xtask gen-map-data

      - name: Check for drift
        run: |
          git diff --exit-code -- src/tui/map/coastline.rs src/tui/map/zone_coords.rs \
            || { echo "::error::Vendored map data is stale. Run 'cargo xtask gen-map-data' and commit the result."; exit 1; }
